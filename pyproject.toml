[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-review"
version = "0.1.0"
description = "Run AI-assisted GitHub pull request reviews from a CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "anton.novosyolov@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
ai-review = "ai_review.cli:main"

[project.optional-dependencies]
jira = []
bot = ["python-telegram-bot>=21,<23"]

[tool.setuptools.packages.find]
include = ["ai_review*"]
